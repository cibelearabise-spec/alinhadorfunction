<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alinha — App do Paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#090b0b; --surface:#151918; --surface2:#202624; --line:#333335;
  --text:#f5eedf; --dim:#aaa69c; --accent:#c9a45d; --accent-dark:#a8813a; --accent-ink:#1a1305;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:#050505; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:'DM Sans',system-ui,sans-serif; color:var(--text); padding:40px 16px;
}
h1,h2,h3,.display{font-family:'Playfair Display',serif; font-weight:600; letter-spacing:.01em;}
.phone{
  width:380px; height:780px; background:var(--bg); border-radius:44px; overflow:hidden;
  position:relative; box-shadow:0 30px 80px rgba(0,0,0,.6); border:8px solid #05070a;
}
.statusbar{display:flex; justify-content:space-between; padding:14px 24px 4px; font-size:13px; color:var(--text); font-weight:600;}
.screen{
  position:absolute; inset:0; padding-top:38px; background:var(--bg);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .32s ease; opacity:0; pointer-events:none;
}
.screen.active{transform:translateX(0); opacity:1; pointer-events:auto; z-index:2;}
.screen.base{transform:translateX(0); opacity:1;}
.scroll{flex:1; overflow-y:auto; padding:14px 20px 90px;}
.scroll::-webkit-scrollbar{display:none;}

/* top bars */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 20px 14px;}
.hello{font-size:12px; color:var(--dim);}
.hello b{color:var(--text); font-size:16px; display:block; margin-top:2px; letter-spacing:.3px;}
.iconbtn{width:36px; height:36px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; border:1px solid var(--line); cursor:pointer;}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:12px;}
.appt-card{display:flex; justify-content:space-between; align-items:center;}
.appt-card .lbl{font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:.12em; margin-bottom:4px; font-weight:600;}
.appt-card .when{font-size:14px; font-weight:600;}
.appt-card .sub{font-size:12px; color:var(--dim); margin-top:2px;}
.btn-ghost{border:1px solid var(--line); color:var(--text); background:transparent; padding:7px 14px; border-radius:10px; font-size:12px; cursor:pointer;}

.sect-title{display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 8px;}
.sect-title h3{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); font-weight:600;}

/* login screen style */
.login-screen { padding: 30px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
.logo-badge { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent); margin-bottom: 12px; }
.login-tabs { display: flex; width: 100%; gap: 8px; margin: 24px 0; background: var(--surface); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.ltab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--dim); border-radius: 8px; font-weight: 600; cursor: pointer; }
.ltab.active { background: var(--surface2); color: var(--text); border: 1px solid var(--line); }
.form-group { width: 100%; text-align: left; margin-bottom: 14px; }
.form-group label { font-size: 11px; color: var(--dim); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .08em; }
.form-group input { width: 100%; background: var(--surface); border: 1px solid var(--line); padding: 12px; border-radius: 10px; color: var(--text); font-family: inherit; }
.main-btn { background: var(--accent); color: var(--accent-ink); border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: .08em; margin-top: 10px; }

/* nav */
.tabbar{position:absolute; bottom:0; left:0; right:0; height:76px; background:var(--surface); border-top:1px solid var(--line); display:flex; z-index:5; padding-bottom:14px;}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--dim); font-size:10.5px; cursor:pointer;}
.tab.active{color:var(--accent);}
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span>09:41</span>
    <span>5G</span>
  </div>

  <!-- TELA DE LOGIN / CADASTRO -->
  <div class="screen active" id="loginScreen">
    <div class="login-screen">
      <div class="logo-badge">✦</div>
      <h1 style="font-size: 24px; margin-bottom: 4px;">ALINE</h1>
      <p style="font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .15em; margin-bottom: 20px;">Alinhadores Invisíveis</p>
      
      <div class="login-tabs">
        <button class="ltab active">Entrar</button>
        <button class="ltab" onclick="irParaApp()">Cadastrar</button>
      </div>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" value="voce@email.com">
      </div>
      
      <div class="form-group">
        <label>Senha</label>
        <input type="password" value="********">
      </div>

      <button class="main-btn" onclick="irParaApp()">Entrar</button>
    </div>
  </div>

  <!-- TELA PRINCIPAL DO APP -->
  <div class="screen" id="homeScreen">
    <div class="topbar">
      <div class="hello">Bem-vindo(a) <b id="nomeUsuario">Cibele</b></div>
      <div class="iconbtn" onclick="carregarDados()">🔄</div>
    </div>
    <div class="scroll">
      <div class="card appt-card">
        <div>
          <div class="lbl">Próxima Consulta</div>
          <div class="when" id="infoConsulta">A carregar...</div>
          <div class="sub">Clínica Alinha</div>
        </div>
        <button class="btn-ghost">Detalhes</button>
      </div>

      <div class="sect-title">
        <h3>Seu Progresso</h3>
      </div>
      <div class="card">
        <div id="statusConexao" style="font-size: 12px; color: var(--dim);">Supabase conectado com sucesso.</div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab active">Início</div>
    </div>
  </div>
</div>

<script>
  // Configuração do Supabase com as suas chaves
  const SUPABASE_URL = 'https://tgsyfhecpbsprcnzhdmt.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_RFfd6QKw6rZZXGpcEo7gHA_DKOU5zXL';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function irParaApp() {
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('homeScreen').classList.add('active');
    carregarDados();
  }

  async function carregarDados() {
    const el = document.getElementById('infoConsulta');
    el.innerText = 'A atualizar...';

    try {
      const { data, error } = await _supabase.from('consultas').select('*').limit(1);

      if (error) throw error;

      if (data && data.length > 0) {
        el.innerText = data[0].data_consulta || 'Consulta agendada';
      } else {
        el.innerText = 'Nenhuma consulta encontrada';
      }
    } catch (err) {
      console.error('Erro ao buscar dados:', err);
      el.innerText = 'Erro ao carregar dados';
    }
  }
</script>

</body>
</html>
