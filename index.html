<style>
:root{
  --bg:#090b0b; --surface:#151918; --surface2:#202624; --line:#333335;
  --text:#f5eedf; --dim:#aaa69c; --accent:#c9a45d; --accent-dark:#a8813a; --accent-ink:#1a1305;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:#050505; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:'DM Sans',system-ui,sans-serif; color:var(--text); padding:40px 16px;
}
h1,h2,h3,.display{font-family:'Playfair Display',serif; font-weight:600; letter-spacing:.01em;}
.phone{
  width:380px; height:780px; background:var(--bg); border-radius:44px; overflow:hidden;
  position:relative; box-shadow:0 30px 80px rgba(0,0,0,.6); border:8px solid #05070a;
}
.statusbar{display:flex; justify-content:space-between; padding:14px 24px 4px; font-size:13px; color:var(--text); font-weight:600;}
.screen{
  position:absolute; inset:0; padding-top:38px; background:var(--bg);
  display:flex; flex-direction:column; transform:translateX(100%); transition:transform .32s ease; opacity:0; pointer-events:none;
}
.screen.active{transform:translateX(0); opacity:1; pointer-events:auto; z-index:2;}
.scroll{flex:1; overflow-y:auto; padding:14px 20px 90px;}
.scroll::-webkit-scrollbar{display:none;}

/* top bars */
.topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 20px 14px;}
.hello{font-size:12px; color:var(--dim);}
.hello b{color:var(--text); font-size:16px; display:block; margin-top:2px; letter-spacing:.3px;}
.iconbtn{width:36px; height:36px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; border:1px solid var(--line); cursor:pointer;}
.back-header{display:flex; align-items:center; gap:12px; padding:6px 20px 10px;}
.back-header h2{font-size:16px;}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px;}
.appt-card{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.appt-card .lbl{font-size:10px; color:var(--accent); text-transform:uppercase; letter-spacing:.12em; margin-bottom:4px; font-weight:600;}
.appt-card .when{font-size:14px; font-weight:600;}
.appt-card .sub{font-size:12px; color:var(--dim); margin-top:2px;}
.btn-ghost{border:1px solid var(--line); color:var(--text); background:transparent; padding:7px 14px; border-radius:10px; font-size:12px; cursor:pointer;}

.sect-title{display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 8px;}
.sect-title h3{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); font-weight:600;}
.sect-title span{font-size:11px; color:var(--accent); cursor:pointer; text-transform:uppercase; letter-spacing:.06em;}

.ring-wrap{display:flex; align-items:center; gap:16px; margin-bottom:6px;}
.ring{width:88px; height:88px;}
.ring-txt b{font-size:22px;}
.ring-txt div{font-size:12px; color:var(--dim); margin-top:2px;}

.feature{background:radial-gradient(circle at 20% 0%,#2a2418,#151412); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:4px; cursor:pointer;}
